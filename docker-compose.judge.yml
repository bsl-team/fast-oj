# 判机容器：把不可信的提交代码关在这里，fast-oj 服务器仍然跑在宿主上。
# 用法：bash scripts/judge.docker.sh   （交叉编译 → 构建镜像 → 起容器）
#
# 判机只需要一个出站连接，所以这里没有 ports:，也没有挂载任何宿主目录。
services:
  judge:
    image: fast-oj-judge:latest
    build:
      context: .
      dockerfile: Dockerfile.judge
    container_name: fast-oj-judge
    environment:
      FASTOJ_SERVER: ${FASTOJ_SERVER:-http://host.docker.internal:18080}
      FASTOJ_JUDGE_TOKEN: ${FASTOJ_JUDGE_TOKEN:?需要判机令牌，与服务器 -judge-token 一致}
      FASTOJ_JUDGE_NAME: ${FASTOJ_JUDGE_NAME:-judge-docker}
    command: ["-dir", "/work", "-run-as", "65534:65534", "-v"]
    # 判机以 root 起步，只为了把每个提交降权到 nobody：同一 uid 时提交程序能读
    # /proc/1/environ，把判机令牌（连 FASTOJ_JUDGE_TOKEN 都在里面）原样拿走。
    # 降权之后那道读不了，而 nproc/RLIMIT 这类按用户算的预算也不再和判机自己抢。
    user: "0:0"
    cap_drop: [ALL]
    # SETUID/SETGID 用来把提交降权；KILL 是必须的：没有 CAP_KILL，root 的判机也发不出
    # SIGKILL 给 uid 65534 的子进程，超时的程序杀不掉、判机卡在管道上（实测踩过）。
    # SYS_ADMIN + NET_ADMIN 是判题沙盒（internal/jail）要的：每次运行要开 mount 与
    # network 命名空间、把宿主只读 bind 进来再 chroot。少了它们沙盒建不起来，
    # 判机会在启动日志与 /judges 上写明"未隔离"。
    # SYS_PTRACE 让判机读得到降权子进程的 /proc/<pid>/statm——内存熔断靠它。没有它
    # 判定仍然正确（峰值走 rusage），只是"超内存立刻掐"会变成"等它自己跑完再说"。
    cap_add: [SETUID, SETGID, KILL, SYS_ADMIN, NET_ADMIN, SYS_PTRACE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    # Docker 给 --tmpfs 默认挂 noexec，而编译产物就放在 /work 里，不写 exec 判题一律 IE。
    tmpfs:
      - /work:rw,nosuid,nodev,exec,size=512m,mode=1777
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    # 硬上限交给 cgroup：判机在里面测量并据实判定，容器负责挡住越界。
    mem_limit: 1g
    memswap_limit: 1g # 不给 swap 兜底，超了就 OOM => MLE，而不是慢慢吞到宿主
    cpus: 2
    pids_limit: 256
    # 单个数字同时给 soft 与 hard（Compose 的写法不是 docker run 的 [soft,hard] 数组）。
    ulimits:
      core: 0
      fsize: 67108864 # 64 MiB，防止把 tmpfs 写满
      nofile: 1024
      nproc: 128
      cpu: 120 # 兜底：正常判题由 wall-clock 先到
    networks: [ojjudge]
    extra_hosts:
      - "host.docker.internal=host-gateway"
    restart: unless-stopped

networks:
  # 实测（Docker Desktop 29.7.2）：`internal: true` 会连 host.docker.internal 一起挡掉，
  # 判机领不到工单（dial tcp 192.168.65.254:18080: network is unreachable），所以默认不开。
  # 提交程序与判机共用同一个网络命名空间，要单独掐掉提交的出口，得 per-run 开一个无网络
  # 的命名空间（容器内 root + CAP_NET_ADMIN + unshare -n，再用 -run-as 降权），这条路
  # 归到外部 sandbox 那一期一起做。
  # 挡住的仍然是关键面：宿主的文件系统、进程、关机权限都拿不到。
  ojjudge:
    name: oj-judge
