{{define "content"}}
<h1>站点设置</h1>
<p class="meta">改完立即生效（缓存 2 秒）。首页语、页脚与 API 提示支持 Markdown 和 $KaTeX$ 公式。</p>

<form method="post" action="/admin/site">
  <input type="hidden" name="csrf" value="{{.Me.CSRF}}">

  <label>站点标题（显示在标签页与导航栏）</label>
  <input type="text" name="title" value="{{.Data.Site.Title}}" maxlength="60" required>

  <label>首页语（首页大标题下面那段）</label>
  <textarea name="tagline" rows="3" maxlength="2000">{{.Data.Site.Tagline}}</textarea>

  <label>友情链接（每行一条，写成「标题 | https://…」，最多 20 条）</label>
  <textarea name="links" rows="5" spellcheck="false">{{.Data.Links}}</textarea>

  <label>页脚（可选）</label>
  <textarea name="footer" rows="2" maxlength="2000">{{.Data.Site.Footer}}</textarea>

  <label>页脚 API 提示（留空则整行不显示）</label>
  <textarea name="api_hint" rows="2" maxlength="2000" spellcheck="false">{{.Data.Site.APIHint}}</textarea>

  <h2>功能开关</h2>
  <p class="meta">关掉的意思是"不再收新的"：已发出去的内容、历史成绩、读这些页面都照旧。
    考试周想安静点，就把动态、帖子、私信关掉，只留题目和比赛。</p>
  <div class="switches">
    <label class="check">
      <input type="checkbox" name="allow_register" value="1" {{if .Data.Site.AllowRegister}}checked{{end}}>
      允许自助注册
    </label>
    <label class="check">
      <input type="checkbox" name="allow_feed" value="1" {{if .Data.Site.AllowFeed}}checked{{end}}>
      允许发动态（犇犇）
    </label>
    <label class="check">
      <input type="checkbox" name="allow_topics" value="1" {{if .Data.Site.AllowTopics}}checked{{end}}>
      允许发帖与评论
    </label>
    <label class="check">
      <input type="checkbox" name="allow_contests" value="1" {{if .Data.Site.AllowContests}}checked{{end}}>
      允许建比赛、加入比赛与赛内提交
    </label>
    <label class="check">
      <input type="checkbox" name="allow_dm" value="1" {{if .Data.Site.AllowDM}}checked{{end}}>
      允许发私信
    </label>
  </div>

  <p><input type="submit" value="保存"></p>
</form>
{{end}}
