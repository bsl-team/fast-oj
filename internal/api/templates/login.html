{{define "content"}}
<h1>登录</h1>

<form method="post" action="/login">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>邮箱或用户名</label>
  <input type="text" name="identifier" value="{{.Data.Identifier}}" autocomplete="username" required>
  <label>密码</label>
  <input type="password" name="password" autocomplete="current-password" required>
  <p><input type="submit" value="登录"></p>
</form>

<p class="meta">还没有账号？<a href="/register">注册</a>。邮箱暂不发送验证邮件，注册后即可使用。</p>
{{end}}
