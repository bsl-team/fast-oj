{{define "content"}}
<h1>设置</h1>
<p class="meta">{{.Me.Name}}（{{.Me.Handle}}） · 邮箱 {{.Data.Email}} · 注册于 {{.Data.Joined}}</p>

<h2>个人资料</h2>
<form method="post" action="/settings/profile">
  <input type="hidden" name="csrf" value="{{.Me.CSRF}}">
  <label>昵称</label>
  <input type="text" name="display_name" value="{{.Data.DisplayName}}" maxlength="40">
  <label>个人简介（支持 Markdown 与 $KaTeX$，显示在你的主页）</label>
  <textarea name="bio" spellcheck="false">{{.Data.Bio}}</textarea>
  <p><input type="submit" value="保存"></p>
</form>

<h2>谁可以给我发私信</h2>
<form method="post" action="/settings/privacy">
  <input type="hidden" name="csrf" value="{{.Me.CSRF}}">
  <label class="check">
    <input type="radio" name="dm_policy" value="everyone" {{if eq .Data.DMPolicy "everyone" }}checked{{end }}>
    所有人（默认）
  </label>
  <label class="check">
    <input type="radio" name="dm_policy" value="mutual" {{if eq .Data.DMPolicy "mutual" }}checked{{end }}>
    只接受互相关注的人（拒绝陌生私信）
  </label>
  <label class="check">
    <input type="radio" name="dm_policy" value="following" {{if eq .Data.DMPolicy "following" }}checked{{end }}>
    只接受我关注过的人
  </label>
  <label class="check">
    <input type="radio" name="dm_policy" value="off" {{if eq .Data.DMPolicy "off" }}checked{{end }}>
    完全关闭私信
  </label>
  <p><input type="submit" value="保存"></p>
</form>
<p class="meta">这个限制只挡新发的私信，已经发过来的仍然看得到。</p>

<h2>密码</h2>
{{if .Data.HasPassword}}
<form method="post" action="/settings/password">
  <input type="hidden" name="csrf" value="{{.Me.CSRF}}">
  <label>当前密码</label>
  <input type="password" name="current" autocomplete="current-password" required>
  <label>新密码（至少 10 位）</label>
  <input type="password" name="password" autocomplete="new-password" required>
  <p><input type="submit" value="修改密码（会退出其它设备）"></p>
</form>
{{else}}
<form method="post" action="/settings/password">
  <input type="hidden" name="csrf" value="{{.Me.CSRF}}">
  <label>设置密码（至少 10 位）。这个账号还没有密码，登不了网页。</label>
  <input type="password" name="password" autocomplete="new-password" required>
  <p><input type="submit" value="设置密码"></p>
</form>
{{end}}
{{end}}
